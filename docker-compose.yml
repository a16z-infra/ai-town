services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    ports:
      - '3210:3210'
      - '3211:3211'
    volumes:
      - convex_data:/convex/data
    environment:
      - INSTANCE_NAME=stanford-town
      - INSTANCE_SECRET=abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - RUST_BACKTRACE=1
      - RUST_LOG=info,common::errors=debug
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s
    networks:
      - town-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5174:5174'
    environment:
      - VITE_CONVEX_URL=http://127.0.0.1:3210
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - town-net

volumes:
  convex_data:

networks:
  town-net:
    driver: bridge
